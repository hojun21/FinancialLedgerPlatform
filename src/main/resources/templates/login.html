<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in · ZeroSum</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="narrow">
    <h1>ZeroSum</h1>

    <!-- Spring Security redirects here with ?error or ?logout -->
    <p class="msg error" th:if="${param.error}">Wrong username or password.</p>
    <p class="msg ok" th:if="${param.logout}">Logged out.</p>
    <p class="msg ok" th:if="${param.signedUp}">Account created. Please log in.</p>

    <!-- Already wired: Spring Security handles POST /web/login.
         Field names MUST be "username" and "password". -->
    <form th:action="@{/web/login}" method="post" class="card">
        <label>Username <input name="username" required autofocus></label>
        <label>Password <input name="password" type="password" required></label>
        <button type="submit">Log in</button>
    </form>

    <p>No account? <a th:href="@{/web/signup}">Sign up</a></p>
</main>
</body>
</html>
